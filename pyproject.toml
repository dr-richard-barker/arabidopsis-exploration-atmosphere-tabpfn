[build-system]
requires = ["setuptools==65.5.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arabidopsis-atmosphere-catalog"
version = "0.1.0"
description = "Metadata-only Arabidopsis exploration-atmosphere omics catalog"
requires-python = ">=3.11"
authors = [{name = "Richard John Barker"}]
license = {text = "MIT"}
dependencies = ["requests==2.34.2", "python-docx==1.2.0"]

[project.scripts]
atmos-catalog = "atmos_catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
